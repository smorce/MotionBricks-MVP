<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ロゼ MotionBricks 実験室</title>
  <style>
    html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;background:#141821;color:white;overflow:hidden}
    #background{position:absolute;inset:0;background-position:center;background-size:cover;opacity:.55;pointer-events:none}
    canvas{position:absolute;inset:0;display:block}
    #toolbar{position:absolute;z-index:2;top:14px;left:14px;max-width:400px;max-height:calc(100vh - 28px);overflow:auto;background:#151b2de8;backdrop-filter:blur(8px);padding:15px;border-radius:13px;box-shadow:0 4px 20px #0008}
    label{display:block;font-size:12px;margin:9px 0 4px;color:#cdd5e7} input,select{max-width:100%;font-size:13px}
    #cases{display:flex;flex-direction:column;gap:4px;margin-top:8px}
    #cases button{text-align:left;background:#243049;color:#fff;border:1px solid #3d4d6e;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px}
    #cases button.active{border-color:#e0a96d;background:#3a2e22}
    #blurb{font-size:12px;line-height:1.5;color:#d5dced;margin:8px 0 0}
    #status{font-size:12px;line-height:1.6;white-space:pre-wrap;color:#bde0d2;margin-top:8px}
    #tips{margin:8px 0 0;color:#9aa6bf;font-size:11px;line-height:1.4}
    #stance{margin-top:12px;padding-top:10px;border-top:1px solid #2c3854}
    #stance input[type=range]{width:100%;accent-color:#e0a96d;margin:2px 0 6px}
    #stanceData{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.45;background:#0e1422;border-radius:8px;padding:6px 8px;color:#d5f5e8;margin:0;word-break:break-all}
    #stanceCopy,#gaitDebug,#gaitLog{margin-top:6px;background:#243049;color:#fff;border:1px solid #3d4d6e;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px}
    #gaitReadout{font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.4;color:#d5f5e8;margin:6px 0 0}
  </style>
</head>
<body>
  <div id="background"></div>
  <div id="toolbar">
    <b>紅璃ロゼ — MotionBricks MVP</b>
    <p><a href="/stop-distance-lab.html?prepared" style="display:block;padding:10px;border:1px solid #79d9c0;border-radius:8px;color:#a7f1d8">F001接続の確認パターンを見る（5種類） →</a></p>
    <p><a href="/stop-distance-lab.html?prepared&relaxation" style="color:#a7f1d8">停止失敗後のゆっくり待機移行を確認 →</a></p>
    <label for="stopMode">停止制御（次のクリックから適用）</label>
    <select id="stopMode"><option value="prepared" selected>停止準備 → F001接続（新実験）</option><option value="visual">目視11候補・厳密一致（前の実験）</option></select>
    <p style="font-size:12px;white-space:pre-wrap;color:#bde0d2" id="visualStopStatus">新実験：停止準備からF001へ接続。自然さは目視でご判断ください。</p>
    <div id="stance">
      <label for="legAdduct">足の閉じ具合 <output id="legAdductOut">0.0°</output></label>
      <input id="legAdduct" type="range" min="0" max="24" step="0.5" value="0">
      <label for="armAbduct">手の横幅 <output id="armAbductOut">0.0°</output></label>
      <input id="armAbduct" type="range" min="0" max="30" step="0.5" value="0">
      <label for="toeForward">つま先を正面へ <output id="toeForwardOut">0.0°</output></label>
      <input id="toeForward" type="range" min="0" max="40" step="0.5" value="0">
      <p id="stanceData">{"leg_adduct_deg":0.0,"arm_abduct_deg":0.0,"toe_forward_deg":0.0}</p>
      <button id="stanceCopy" type="button">この数値をコピー</button>
    </div>
    <label>ロゼのVRMファイル <input id="vrmFile" type="file" accept=".vrm"></label>
    <label>背景画像（任意） <input id="backgroundFile" type="file" accept="image/*"></label>
    <p id="blurb">地面をクリックすると、距離に合わせて歩いて止まり、着地した足幅のまま待機します。マーカーは到着動作です。</p>
    <p id="tips">左クリックで場面へ移動。左ドラッグで回転、右ドラッグで平行移動、ホイールでズーム。D キーで足の接地表示。</p>
    <button id="gaitDebug" type="button">歩行デバッグを表示</button>
    <button id="gaitLog" type="button">計測ログを保存</button>
    <p id="gaitReadout"></p>
    <div id="cases"></div>
    <div id="status">接続待ち…</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
