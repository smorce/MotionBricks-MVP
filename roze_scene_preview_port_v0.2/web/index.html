<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ロゼ MotionBricks 実験室</title>
  <style>
    html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;background:#141821;color:white;overflow:hidden}
    #background{position:absolute;inset:0;background-position:center;background-size:cover;opacity:.55;pointer-events:none}
    canvas{position:absolute;inset:0;display:block}
    #toolbar{position:absolute;z-index:2;top:14px;left:14px;max-width:360px;background:#151b2de8;backdrop-filter:blur(8px);padding:15px;border-radius:13px;box-shadow:0 4px 20px #0008}
    label{display:block;font-size:12px;margin:9px 0 4px;color:#cdd5e7} input,select{max-width:100%;font-size:13px}
    #status{font-size:12px;line-height:1.6;white-space:pre-wrap;color:#bde0d2;margin-top:8px}
    #tips{position:absolute;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);background:#101623dc;padding:10px 16px;border-radius:14px;font-size:12px}
  </style>
</head>
<body>
  <div id="background"></div>
  <div id="toolbar">
    <b>紅璃ロゼ — Scene Preview停止処理版</b>
    <label>ロゼのVRMファイル <input id="vrmFile" type="file" accept=".vrm"></label>
    <label>背景画像（任意） <input id="backgroundFile" type="file" accept="image/*"></label>
    <label>クリック先の種類 <select id="zone"><option value="floor">床（移動して立つ）</option><option value="chair">椅子（着席は変換ポーズが必要）</option><option value="reaction">リアクション地点</option></select></label>
    <label>目的 <input id="intent" value="Move there naturally and stand" style="width:95%"></label>
    <div id="status">接続待ち…</div>
  </div>
  <div id="tips">クリックで目的地を指定。背景画像は表示のみで、床座標の校正は未実装です。</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
